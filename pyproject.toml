[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyrallex"
version = "1.0.1"
description = "A small package for PARALLel EXecution and management of computing jobs using different parallelisation backends."
readme = "README.md"
requires-python = ">=3.12"

license = "MIT"
license-files = ["LICEN[CS]E*"]

authors = [
    { name = "Jakob Bossek", email = "j.bossek@gmail.com" }
]

keywords = [
    "parallelisation",
    "benchmarking",
    "jobs",
    "job-management"
]

dependencies = [
    "joblib>=1.5"
]

classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/jakobbossek/pyrallex"
Documentation = "https://jakobbossek.github.io/pyrallex/"
Repository = "https://github.com/jakobbossek/pyrallex"
Issues = "https://github.com/jakobbossek/pyrallex/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
]